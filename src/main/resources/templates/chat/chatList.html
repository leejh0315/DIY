<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
<style>
	img{
		width: 100px;
		height: 100px;
	}
</style>
<link rel="stylesheet" th:href="@{/css/main.css}">
<script src='https://kit.fontawesome.com/c8fabc7e12.js' crossorigin='anonymous'></script>
<script src="https://code.jquery.com/jquery-1.12.4.js"></script>
</head>
<body>
	
<div th:replace="main/header :: headFrag(${member.activeUUID})"></div>
    

<table>
    <div th:each="room, i : ${tempList}" >
			<div th:id="${i.index}" class="room" onclick="selected(this)">
				<div th:with="member=${roomMap.get(room.chatReceiverId)}">
					<img th:src="${member.profileSrc}">
					<div th:text="${member.nickName}"></div>
					<div th:text="${chatOrder[i.index].message}"></div>
					<div th:text="${chatOrder[i.index].sendDate}"></div>
				</div>
            </div>
    </div>
</table>

<script th:inline="javascript">
	var room = /*[[${tempList}]]*/ [];
	var roomMap =  /*[[${roomMap}]]*/ [];
	console.log(room);
	console.log(roomMap);
	

	
	
	function selected(e){
		console.log(e.id);
		window.location.href = '/chat/chatRoom/'+room[e.id].roomId;
	} 
	
	
	
</script>
<script th:src="@{/js/nav.js}"></script>
</body>
</html>
