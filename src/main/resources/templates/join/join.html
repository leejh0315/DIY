
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
<script src="https://code.jquery.com/jquery-1.12.4.js"></script>
<script src='https://kit.fontawesome.com/c8fabc7e12.js' crossorigin='anonymous'></script>

<link rel="stylesheet" th:href="@{/css/main.css}">
<link rel="stylesheet" th:href="@{/css/join.css}">
</head>
<body>
   <th:block th:if="${member == null}">
      <div th:replace="main/header :: headFrag(${none})"></div>
   </th:block>
   <th:block th:if="${member != null}">
      <div th:replace="main/header :: headFrag(${member.activeUUID})"></div>
   </th:block>


   
   <!-- join -->
   <div class="join_wrap">
   <h1>회원가입</h1>
   <p class="sub">문득에서 문화 기록을 시작하세요</p>
   <form action="/home/join" method="post" th:object="${joinForm}" id="joinForm" name="joinForm">
      <div id="emailInputBox" class="emailInputBox">
         <p>이메일</p><br>
         <div class="input_wrap">
            <input id="email" name="loginId"  th:value="${joinForm.loginId}" placeholder="example@example.com">
            <button id="joongbok">이메일 중복확인</button>
            <button id="sendMailButton">이메일인증</button>
         </div>
         <div id="emailCheckMsg"></div>

         
      </div>
   
      <div id="numberCheckBox">
         <p>이메일 인증</p><br>
         <div class="input_wrap">
            <input id="numberCheck" placeholder="인증번호를 입력하세요">
            <button id="numberCheckButton">인증번호확인</button>
         </div>
      </div>
      
         <div id="countBox" class="countBox">
            <p id="count" class="count"></p>
            <p id="countText" class="countText">인증번호는 3분간 유효합니다.</p>
         </div>
         <br>
      <div id="passwordBox">
         <p>비밀번호</p><br>
         <input id="password" type="password" name="password" th:value="${joinForm.password}" placeholder="비밀번호를 입력하세요"><br>
         <div th:errors="*{password}"></div>
         <p>비밀번호 확인</p><br>
         <input id="passwordCheck" type="password" name="passwordCheck"  th:value="${joinForm.passwordCheck}" placeholder="비밀번호를 입력하세요">
         <div th:errors="*{passwordCheck}"></div>
      </div>
   
      <div id="nameBox">
         <p>닉네임</p><br>
         <input id="name" name="nickName"  th:value="${joinForm.nickName}" placeholder="사용할 닉네임을 입력해주세요">
         <div th:errors="*{nickName}"></div>
      </div>
         
   <div th:if="${#fields.hasGlobalErrors()}">
      <p th:each="error : ${#fields.globalErrors()}" th:text="${error}">
      글로벌오류
      </p>
   </div>
      <button id="joinButton" class="joinButton">회원가입</button>
   </form>
</div>
<script>
   $("#countBox").css("display", "none");         //카운트박스, 초기 진입시에 안보이게
   $("#numberCheckBox").css("display", "none");   //인증번호체크박스, 이메일 중복검사를 마친 후에, 인증번호를 전송하면 보이게
   $("#sendMailButton").css("display", "none");   //이메일 전송 버튼, 이메일 중복 검사를 마친 후에 보이게
   
   let email1 = document.getElementById("email");
   let sendMailButton = document.getElementById("sendMailButton");
   let checkNumber;
   let joinButton = document.getElementById("joinButton");
   let form = document.joinForm;
   let joongbok = document.getElementById("joongbok");
   let countText = document.getElementById("countText");
   let count = document.getElementById('count');
   var email = "";
   let total_time = 180;
   let minute = total_time / 60;
   let second = total_time % 60;
   let interval;
   let emailCheckMsg = document.getElementById("emailCheckMsg");
   /*수정 요망*/
//   joinButton.addEventListener("click",(e)=>{
//      form.submit();
//   });
   /*수정 요망*/


   joongbok.addEventListener("click",(e)=>{   //중복체크
      e.preventDefault();
      email = email1.value.toString();
      $.ajax({
            type : "POST",
            url : "/home/joongbok",
            data : {
               "email" : email
            }, success : function(data){
               if(data == 1){
                  emailCheckMsg.innerHTML="<div class='emailCheckMsg'><i class='fas fa-times-circle'></i>  사용불가능한 이메일입니다.</div>";
                  emailCheckMsg.style.color="#E52834";
                  email1.focus();
               }else{
                  emailCheckMsg.innerHTML="<div class='emailCheckMsg'><i class='fas fa-check-circle'></i>  사용가능한 이메일입니다.</div>";
                  emailCheckMsg.style.color="#2C28E5";
                  $("#joongbok").css("display", "none");
                  $("#sendMailButton").show();  
                  $("#email").attr("readonly",true);
               }
                        
            }
      });
      
      
   });
   
   sendMailButton.addEventListener('click',(e)=>{
      e.preventDefault();
      total_time = 180;
      interval = setInterval(() =>{
         countMinus()
      }, 1000);
      console.log("이메일 전송");
      alert("이메일이 전송되었습니다.");
      $("#numberCheckBox").show();
      $("#countBox").show();
      $("#joongbok").css("display", "none");
      $("#sendMailButton").css("display", "none");
      $("#numberCheck").removeAttr("disabled");
      $("#numberCheckButton").removeAttr("disabled");
      $.ajax({
            type : "POST",
            url : "/email/emailConfirm",
            data : {
               "email" : email
            },success : function(){
      
            }
      });


   });
   
   let numberCheck = document.getElementById("numberCheck");
   let numberCheckButton = document.getElementById("numberCheckButton");
   
   numberCheckButton.addEventListener('click',(e)=>{
      e.preventDefault();
      let number = numberCheck.value.toString();

      $.ajax({
            type : "POST",
            url : "/email/numberCheck",
            data : {
               "number" : number
            }, success : function(data){
                  console.log(data);
                  checkNumber = data;
                  if(data == 1){
                     alert("인증번호가 일치합니다.");
                     $("#sendMailButton").css("display", "none");
                     $("#numberCheckBox").css("display", "none");
                     $("#countBox").css("display", "none");
                     $.ajax({
				            type : "POST",
				            url : "/home/tempEmailSave",
				            data : {
				               "email" : email
				            }, success : function(data){
			               	}
				      });
				                  
     			window.location.replace('/home/join2');
                  }else if(data == 0){
                     alert("인증번호가 일치하지 않습니다.");
                  }else{
                     alert("인증시간이 만료되었습니다.");
                  }
               }
      });
      
   });


   function countMinus(){
      total_time--;
      minute = parseInt(total_time / 60);
      second = parseInt(total_time % 60);
      count.innerText = minute + ":" +second;
      if(total_time <= 0){
         clearInterval(interval);
         count.innerText = "인증시간이 만료되었습니다. 재요청하십시오.";
         $("#sendMailButton").show();
         $("#countText").css("display", "none");
         $("#numberCheck").attr("disabled",true);
         $("#numberCheckButton").attr("disabled",true);
         //$("#txtBox").removeAttr("disabled"); 

      }
   }

</script>
</body>
</html>
