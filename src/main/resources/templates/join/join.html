<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
<script src="https://code.jquery.com/jquery-1.12.4.js"></script>
</head>
<body>
	<h1>JOIN</h1>
	<form action="/join" method="post" th:object="${joinForm}" id="joinForm" name="joinForm">
		<div id="emailInputBox">
			<label>Email<input id="email" th:field="*{loginId}"></label>
			<button id="joongbok">중복체크</button>
			<button id="sendMailButton">이메일인증</button>
			<div th:errors="*{loginId}"></div>
			<div id="countBox">
				<p id="count"></p>
				<p id="countText">인증번호는 3분간 유효합니다.</p>
			</div>
		</div>
	
		<div id="numberCheckBox">
			<label>인증번호<input id="numberCheck"></label>
			<button id="numberCheckButton">인증번호확인</button>
		</div>
	
	
		<div id="passwordBox">
			<label>Password<input id="password" type="password" th:field="*{password}"> </label><br>
			<div th:errors="*{password}"></div>
			<label>Password 확인
				<input id="passwordCheck" type="password" th:field="*{passwordCheck}">
			</label>
			<div th:errors="*{passwordCheck}"></div>
		</div>
	
		<div id="nameBox">
			<label>닉네임<input id="name" th:field="*{nickName}"></label>
			<div th:errors="*{nickName}"></div>
		</div>
			
	<div th:if="${#fields.hasGlobalErrors()}">
		<p th:each="error : ${#fields.globalErrors()}" th:text="${error}">
		글로벌오류
		</p>
	</div>
		
		<button id="joinButton">회원가입</button>
	</form>

<script>
	$("#countBox").css("display", "none");			//카운트박스, 초기 진입시에 안보이게
	$("#numberCheckBox").css("display", "none");	//인증번호체크박스, 이메일 중복검사를 마친 후에, 인증번호를 전송하면 보이게
	$("#sendMailButton").css("display", "none");	//이메일 전송 버튼, 이메일 중복 검사를 마친 후에 보이게
	
	let email1 = document.getElementById("email");
	let sendMailButton = document.getElementById("sendMailButton");
	let checkNumber;
	let joinButton = document.getElementById("joinButton");
	let form = document.joinForm;
	let joongbok = document.getElementById("joongbok");
	let countText = document.getElementById("countText");
	let count = document.getElementById('count');
	var email = "";
	let total_time = 10;
	let minute = total_time / 60;
	let second = total_time % 60;
	let interval;
	/*수정 요망*/
//	joinButton.addEventListener("click",(e)=>{
//		form.submit();
//	});
	/*수정 요망*/


	joongbok.addEventListener("click",(e)=>{	//중복체크
		e.preventDefault();
		email = email1.value.toString();
		$.ajax({
				type : "POST",
				url : "/joongbok",
				data : {
					"email" : email
				}, success : function(data){
					if(data == 1){
						alert("사용 불가능한 이메일");
						email1.focus();
					}else{
						alert("사용 가능한 이메일");
						$("#joongbok").css("display", "none");
						$("#sendMailButton").show();  
						$("#email").attr("readonly",true);
					}
								
				}
		});
		
		
	});
	
	sendMailButton.addEventListener('click',(e)=>{
		e.preventDefault();
		total_time = 10;
		interval = setInterval(() =>{
			countMinus()
		}, 1000);
		
		alert("이메일이 전송되었습니다.");
		$("#numberCheckBox").show();
		$("#countBox").show();
		$("#joongbok").css("display", "none");
		$("#sendMailButton").css("display", "none");
		$("#numberCheck").removeAttr("disabled");
		$("#numberCheckButton").removeAttr("disabled");
		$.ajax({
				type : "POST",
				url : "/emailConfirm",
				data : {
					"email" : email
				},success : function(){
		
				}
		});


	});
	
	let numberCheck = document.getElementById("numberCheck");
	let numberCheckButton = document.getElementById("numberCheckButton");
	
	numberCheckButton.addEventListener('click',(e)=>{
		e.preventDefault();
		let number = numberCheck.value.toString();

		$.ajax({
				type : "POST",
				url : "/numberCheck",
				data : {
					"number" : number
				}, success : function(data){
						console.log(data);
						checkNumber = data;
						if(data == 1){
							alert("인증번호가 일치합니다.");
							$("#sendMailButton").css("display", "none");
							$("#numberCheckBox").css("display", "none");
							$("#countBox").css("display", "none");	
						}else if(data == 0){
							alert("인증번호가 일치하지 않습니다.");
						}else{
							alert("인증시간이 만료되었습니다.");
						}
					}
		});
		
	});


	function countMinus(){
		total_time--;
		minute = parseInt(total_time / 60);
		second = parseInt(total_time % 60);
		count.innerText = minute + ":" +second;
		if(total_time <= 0){
			clearInterval(interval);
			count.innerText = "인증시간이 만료되었습니다. 재요청을 하십시오.";
			$("#sendMailButton").show();
			$("#countText").css("display", "none");
			$("#numberCheck").attr("disabled",true);
			$("#numberCheckButton").attr("disabled",true);
			//$("#txtBox").removeAttr("disabled"); 

		}
	}

</script>
</body>
</html>
