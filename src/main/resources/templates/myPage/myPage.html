<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
	<script src="https://code.jquery.com/jquery-1.12.4.js"></script>
	<script src='https://kit.fontawesome.com/c8fabc7e12.js' crossorigin='anonymous'></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.5.0/Chart.min.js"></script>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.css">
	<link rel="stylesheet" th:href="@{/css/main.css}">
	<link rel="stylesheet" th:href="@{/css/mypage.css}">
	<link rel="icon" type="image/x-icon" href="data:image/x-icon;,">





<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.18.1/moment.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/locales-all.js"></script>


	<style>
		img{
			width: 100px;
			height: 100px;
		}
		
		.fc-header-toolbar {    
			padding-top: 1em;    
			padding-left: 1em;    
			padding-right: 1em;  
		}
		.posttype{
			border: solid 1px #9A9E7B;
			width: 45px;
			cursor: pointer;
			border-radius: 15px;
			text-align: center;
			padding: 4px 5px;
		}

	</style>
</head>
<body>

		<div th:replace="main/header :: headFrag(${member.activeUUID})"></div>
<div class="wrapcontainer">
	<div class="mypage_Wrap">
	<h3>나의 페이지</h3>
	
	    <div class="top_wrap">
        <div class="recordchart">
            <p>나의 기록 통계</p>
            <canvas id="pie-chart" width="200" height="200"></canvas>
        </div>
        <div class="recordchart">
            <p>월별 기록 통계</p>
            <canvas id="bar-chart" width="200" height="200"></canvas>
        </div>
        <div class="user_wrap">
			
			<input type="hidden" th:value="${memberVo.id}" id="memberId">
			<input type="hidden" th:value="${type}" id="thisType">
		
			
			
            <a th:href="@{|/myPage/update/${memberVo.id}|}">
            <i class="fa-solid fa-gear"></i>
            </a>
			<div class="userimg_colwrap">
            <div class="userimg">
                <img th:src="${memberVo.profileSrc}" alt="">
            </div>
            <div class="userid" th:text="*{memberVo.nickName}"></div>
            <div class="userintro" th:text="*{memberVo.memberIntro}"></div>
			</div>
            <div class="followinfo">
				<a th:href="@{|/followee/${memberVo.id}|}">
				팔로잉<div class="following" id="following" th:text="${following}"></div>
				</a>
				
				<a th:href="@{|/follower/${memberVo.id}|}">
                팔로워<div class="follower" id="follower" th:text="${follower}"></div>
				</a>
            </div>
            
            <button onclick="location.href='/writePost'">
                글 작성
            </button>
        </div>
    </div>


	<!-- <a th:href="@{|/chat/chatList/${member.id}|}">채팅하러 가기</a> -->
	
	<form>
		<div class="chooseposts">
			<div class="posttype 1" id="type_1" onclick="selected(this, 0)" value="myposts">내가 쓴 글</div>
			<div class="posttype 2" id="type_2" onclick="selected(this, 1)" value="myfeed">나의 피드</div>
			<div class="posttype 3" id="type_3" onclick="selected(this, 2)" value= "likedposts">좋아요 한 글</div>
		</div>
	</form>
	<div class="mid_Wrap">
		
		<div class="left_Wrap">
			
			<th:block th:if="${size} == 0">
				<div class="post_cmp">
					게시글이 존재하지 않습니다.
				</div>
			</th:block>
			
			
			
			<div class="post_cmp">
				<div th:each="post,i : ${post}">
					<hr>
					<a th:href="@{|/posts/${post.postCode}|}">
							<div th:id="${i.index}"></div>
							<div class="ctt_Wrap">
								<div class="writerinfo_Wrap">
									<div th:with="profile=${profileSrc[i.index]}" class="profileimg_div">
										<img th:src="${profile}">
									</div>
									<div th:text="${post.memberNick}"></div>
									<div th:text="${post.createOn}"></div>
									<div class="ratebox" >
										★<p th:text="${post.starCount}" style="padding-left: 5px;"></p>
									</div>
								</div>
								<div class="row_Wrap">
									<div class="thumb_Wrap">
										<img th:src="${post.targetThumbnail}">
									</div>
									<div class="col_Wrap">
									<div class="target_Wrap">
										<div th:text="${post.targetName}"></div>
										<div th:text="${post.targetAuthor}"></div>
										<div th:text="${post.targetSubName}"></div>
									</div>
									<div class="postcnt_Wrap">
										<div th:text="${post.title}"></div>
										<div th:text="${post.content}" class="postcontent"></div>
										<input th:value="${post.targetThumbnail}" id="targetThumb" type="hidden">
									</div>
								</div>
							</div>
						</div>
					</a>
					
				</div>
			</div>
			<!-- 페이징 -->
			<div id="pagination">
				<!-- 맨 처음 페이지로 이동하는 버튼 -->
				<span th:if="${pageVo.startPage > 1}">
					<a th:href="@{'/myPage/' + memberVo.id + '?page=1&type=' + ${type} + '&pgroup=' + ${pgroup}}" th:text="'처음&emsp;'"></a>
				</span>
			
				<!-- 이전 블록으로 이동하는 버튼 -->
				<span th:if="${pageVo.isPrev == true}">
					<a th:href="@{'/myPage/' + memberVo.id + '?page=' + (pageVo.startPage - 1) + '&type=' + ${type} + '&pgroup=' + ${pgroup}}" th:text="'이전'"></a>
				</span>
			
				<!-- 시퀀스 보여주는 값을 변경. -->
				<span th:each="pageNum : ${#numbers.sequence(pageVo.startPage, pageVo.endPage)}">
					<a class="div2" th:href="@{'/myPage/'+ ${memberVo.id} +'?page='+${pageNum}+'&type='+${type} + '&pgroup=' + ${pgroup} }" th:text="|&emsp;${pageNum}&emsp;|"></a>
				</span>
				
				<!-- 다음 블록으로 이동하는 버튼 -->
				<span th:if="${pageVo.isNext == true}">
				<a th:href="@{'/myPage/${memberVo.id}?page='+|${pageVo.endPage + 1}|+'&type='+${type} + '&pgroup=' + ${pgroup}}" th:text="'다음'"></a>
				</span>
				
				<!-- 맨 뒷 페이지로 이동하는 버튼 -->
			   <!-- <span th:if="${pageVo.endPage < pageVo.totalPageCount}">
					<a th:href="@{'/myPage/${member.id}?page='+${pageVo.totalPageCount}+'&type='+${type}}" th:text="|&emsp;끝|"></a>
				</span> -->
			</div>
		</div>
		

		<div class="right_Wrap">
			<form>
				<div class="chooseType">
					<p>종류</p>
					<div>
					<label onclick="checked(this, 0)"><input type="checkbox" name="chooseType" value="all" class="checkType all">전체</label>
					<label onclick="checked(this, 1)"><input type="checkbox" name="chooseType" value="book" class="checkType book">책</label>
					<label onclick="checked(this, 2)"><input type="checkbox" name="chooseType" value="movie" class="checkType movie">영화</label>
					<label onclick="checked(this, 3)"><input type="checkbox" name="chooseType" value="concert" class="checkType concert">공연</label>
					</div>
				</div>
				</form>

			
			
			<div id='calendar-container' class="calendar-container">    
				<div id='calendar'></div>  
			</div>
		</div>

	</div>

    
	
	
	
</div>
	

</div>
<script th:inline="javascript">
    var myData = /*[[${posts}]]*/ [];
    var cntArr = /*[[${cntArr}]]*/ [];
	
    var pgroup = /*[[${pgroup}]]*/ '';
</script>

	<script>
		
	
	
	console.log(myData);
	console.log(cntArr);
	let arrDate = [];
	let arrSrc = [];




	for(let i=0;i<myData.length;i++){
		let createOnSrc = myData[i].createOn.substring(0,10);
		arrDate.push(myData[i].createOnSrc);
		arrSrc.push(myData[i].targetSrc);
		

		
	}

	(function(){    
		$(function(){      // calendar element 취득      
		var calendarEl = $('#calendar')[0];      // full-calendar 생성하기      
		var calendar = new FullCalendar.Calendar(calendarEl, {        
			height: '700px',// calendar 높이 설정
			         
			expandRows: false, // 화면에 맞게 높이 재설정        
			slotMinTime: '08:00', // Day 캘린더에서 시작 시간        
			slotMaxTime: '20:00', // Day 캘린더에서 종료 시간        
			initialView: 'dayGridMonth', // 초기 로드 될때 보이는 캘린더 화면(기본 설정: 달)        
			dayMaxEvents: true, // 이벤트가 오버되면 높이 제한 (+ 몇 개식으로 표현)        
			locale: 'ko', // 한국어 설정        
				eventAdd: function(obj) { // 이벤트가 추가되면 발생하는 이벤트          
					//console.log(obj);        
				},        
				eventChange: function(obj) { // 이벤트가 수정되면 발생하는 이벤트          
					//console.log(obj);        
				},        
				eventRemove: function(obj){ // 이벤트가 삭제되면 발생하는 이벤트          
					//console.log(obj);        
				},
			
			events: getDynamicEvents(),
			 eventDidMount: function (arg) {
    			addImage(arg);
				}
			});      // 캘린더 랜더링      
					calendar.render();    
				});  
			})();
			
	function getDynamicEvents() {
        let dynamicEvents = [];

        for (let i = 0; i < myData.length; i++) {
            // createOn을 yyyy-mm-dd 형식으로 변환
            let createOnSrc = myData[i].createOn.substring(0, 10);
            
            // 동적으로 이벤트 추가
            if(!dynamicEvents.some(event => event.start === createOnSrc)){
	            dynamicEvents.push(
					{
	                start: createOnSrc,
	                imageUrl: myData[i].targetThumbnail,
            		}
	            );
				
			}
         	//console.log(dynamicEvents);   
        }
		
        return dynamicEvents;
    }
    
    
 function addImage(eventInfo) {
    // Create a new element to hold the image
    var img = document.createElement('img');
    img.src = eventInfo.event.extendedProps.imageUrl;
    img.style.width = '100%';  // Adjust the width as needed
    img.style.height = '100%';  // Adjust the height as needed

    // Create a new div element to hold the image element
    var container = document.createElement('div');
    container.appendChild(img);

    // Set the content of the calendar event to be the container
    eventInfo.el.innerHTML = '';
    eventInfo.el.appendChild(container);
	eventInfo.el.style.backgroundColor="transparent";
	eventInfo.el.style.border="none";

}
    
    
	let cal = document.getElementById("calendar");
 	cal.style.width = '100%';			

	
	let types = document.querySelectorAll(".checkType");
	let poststypes = document.querySelectorAll(".posttype");
	let memberId = document.getElementById("memberId");
	let memberIdVal = memberId.value;
	
	let thisType = document.getElementById("thisType");
	let thisTypeVal = thisType.value;

	if(pgroup == "myfeed"){
		$(poststypes).css("background-color", "white");
		$(poststypes).css("color", "black");	
		$("#type_2").css("background-color", "#9A9E7B");
		$("#type_2").css("color", "white");

	}else if(pgroup == "likedposts"){
		$(poststypes).css("background-color", "white");
		$(poststypes).css("color", "black");	
		$("#type_3").css("background-color", "#9A9E7B");
		$("#type_3").css("color", "white");
	}else{
		$(poststypes).css("background-color", "white");
		$(poststypes).css("color", "black");	
		$("#type_1").css("background-color", "#9A9E7B");
		$("#type_1").css("color", "white");
			
	}
	
	let selectedPgroup = "";

	function selected(e, type){
		selectedPgroup = $(e).attr("value");
		$(poststypes).css("background-color", "white");
		$(poststypes).css("color", "black");		
		$(e).css("background-color", "#9A9E7B");
		$(e).css("color", "white");
		// console.log($(e).attr("value"));

		for(let i = 0; i<types.length; i++){
			let value;
			if(types[i].checked == true){
				value = types[i].value;
				window.location.href = '/myPage/'+memberIdVal+'?page=1&type='+value +'&pgroup='+selectedPgroup;
			}
		}
	}


	
	for(let i = 0; i<types.length; i++){
		if(types[i].value == thisTypeVal){
			types[i].checked = true;
		}
	}
	function checked(e, number){
		let value;
		for(let i = 0; i<types.length; i++){
			if(i != number){
				types[i].checked = false;				
			}
			console.log('types', [i], ' : ',types[i].checked);
		};
		if(types[0].checked == false && types[1].checked == false && types[2].checked == false && types[3].checked == false){
			types[0].checked = true;
		}
		for(let i = 0; i<types.length; i++){
			if(types[i].checked == true){
				value = types[i].value;
				if(pgroup == ""){
					pgroup = selectedPgroup;
				}
				window.location.href = '/myPage/'+memberIdVal+'?page=1&type='+value+'&pgroup='+pgroup;
			}
		}
		
			
	};
		
	let bookCount = 0;
	let concertCount = 0;
	let movieCount = 0;

	for(let i =0;i<myData.length;i++){	
		if(myData[i].postCtcode == "book"){
			bookCount = bookCount+1;
		}else if(myData[i].postCtcode == "concert"){
			concertCount = concertCount+1;
		}else if(myData[i].postCtcode == "movie"){
			movieCount = movieCount+1;
		}
	}	
	console.log(bookCount);
	console.log(concertCount);
	console.log(movieCount);
		
	new Chart(document.getElementById("pie-chart"), {
    type: 'pie',
    data: {
      labels: ["책", "영화", "공연"],
      datasets: [{
        backgroundColor: ["#3e95cd", "#8e5ea2","#3cba9f"],
        data: [bookCount, movieCount, concertCount]
      }]
    },
    options: {
        responsive: false,
        legend : {position : "bottom",
        align :'end',
        labels: {
              boxWidth: 20
          }
        
        },
       
    }
});
let month2 = cntArr[0];
let month1 = cntArr[1];
let thisMonth = cntArr[2];
let month2Cnt = cntArr[3];
let month1Cnt = cntArr[4];
let thisMonthCnt = cntArr[5];

new Chart(document.getElementById("bar-chart"), {
    type: 'bar',
    data: {
      labels: [ month2+"월",  month1+"월", thisMonth+"월",],
      datasets: [
        {
          
          backgroundColor: ["#3e95cd", "#8e5ea2","#3cba9f",],
          data: [month2Cnt,month1Cnt,thisMonthCnt,]
        }
      ]
    },
    options: {
        responsive: false,
      legend: { display: false },
      scales: {
        yAxes: [{display: true,
                ticks: {
                    suggestedMin: 0,
                },}
            
        ]
    },
}
});
			
	
	</script>
	<script th:src="@{/js/nav.js}"></script>
</body>
</html>
