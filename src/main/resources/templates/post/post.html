<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
	<script src='https://kit.fontawesome.com/c8fabc7e12.js' crossorigin='anonymous'></script>
	<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/postdetail.css}">

</head>
<body>

	<th:block th:if="${member == null}">
		<div th:replace="main/header :: headFrag(${none})"></div>
	</th:block>
	<th:block th:if="${member != null}">
		<div th:replace="main/header :: headFrag(${member.activeUUID})"></div>
	</th:block>
	
	<!-- 신고확인모달 -->
	<div class="modalBackground" id="modalBackground" style="display: none;"></div>

	<div class="reportCheckModal" id="reportCheckModal" style="display: none;">
		<div>
			<div id="modalcontent">글을 신고하시겠습니까?</div>
			<div id="reportCancle">취소</div>
			<div id="reportConfirm">신고</div>
		</div>
	</div>
	
	<div class="modalBackground" id="modalBackground" style="display: none;"></div>
	<div class="deleteModal" id="deleteModal" style="display: none;">
		<div>
			<div id="modalcontent">글을 삭제하시겠습니까?</div>
			<p id="modalcontent">게시글 삭제시 댓글 및 좋아요 정보가 삭제되고, 복구되지 않습니다.</p>
			<div id="deleteCancle">취소</div>
			<div id="deleteConfirm">삭제</div>
		</div>
	</div>




	<!-- posts -->
	<div class="posts_wrap">
	<div class="posttitle" th:text="${post.title}"></div>
	
	<div class="writerinfo">
		<div>
			<div class="writer_profileimg">
				<img th:src="${postWriteMember.profileSrc}"  alt="">
			</div>
			<p th:text="${postWriteMember.nickName}" class="wirter"></p>    
			<p th:text="${post.createOn}" class="createOn"></p>
		</div>
		<th:block th:if="${member != null}">
			<th:block th:if="${member.id == postWriteMember.id}">
				<i class="fas fa-ellipsis-h fa-sm" onclick="toggleEditDeleteButtons(this)"></i>
				<div class="edit-delete-buttons">
					<a th:href="@{|/update/${post.postCode}|}">수정하기</a>
					<div id="deleteBtn">삭제하기</div>
				</div>
			</th:block>
		</th:block>
	</div>
				
		
	<!-- <th:block th:if="${member != null}">
		<th:block th:if="${member.id == postWriteMember.id}">
			
		</th:block>
	</th:block> -->
		<hr>
			<div class="infotitle">작품정보</div>
			<div id="targetInformation" class="targetInformation">
				
				<img th:src="${post.targetThumbnail}" class='targetThumb'>
				<div class="infodetail">
					<div th:text="${post.targetName}"></div>
					<div th:text="${post.targetSubName}"></div>
					<div th:text="${post.targetAuthor}"></div>
				</div>
				<div class="ratebox" >
					★<p th:text="${post.starCount}" style="padding-left: 5px;"></p>
				</div>
			</div>
			<hr>
		<div class="postcontent" th:utext="${post.content}"></div>
		
		<div class="likeReportWrap">
			<th:block th:if="${member != null}">
				<div class="likes" id="likes" onclick="postLikes()">
					<input th:value="${likescnt}" type="hidden" id="likescnt">
					<i id="likesicon" class="far fa-heart" style="color: #9A9E7B;"></i>
					<p>좋아요</p>
				</div>
			</th:block>
			
			<th:block th:if="${member != null}">
				<th:block th:if="${member.id != postWriteMember.id}" >
						<input th:value="${reportpostcnt}" type="hidden" id="reportedcheck">
						<button class="reportbtn" id="reportbtn" >신고</button>
				</th:block>
						
			</th:block>
		</div>		
				

			

		<div class="replycnt">댓글<div th:text="${replyCnt}"></div></div>
		<hr>
			<!-- 댓글 없을 때 -->
			<th:block th:if="${replyCnt == 0}">
			 <div class="noReply">
				<div class="noreplydiv">댓글이 없습니다.</div>
			 </div>
			 <hr>
			</th:block>
		 	<!-- 댓글 있을 때 -->
			<th:block th:if="${replyCnt != 0}">
				<!-- 댓글리스트 -->
				<tr th:each="replylist :${replylist}">
					<div class="replyWrap">
					<img class="img" th:src="${replylist.userProfileSrc}" alt=""></img>
						<div class="reply_top">
							<div><td th:text ="${replylist.nickName}"></td></div>
							<div><td th:text="${replylist.replyContent}"></td></div>
							<div class="reply_btm">
								<div><td th:text="${replylist.replyCreateDate}"></td></div>
								<!-- 대댓글버튼 -->
								<th:block th:if="${member != null}">
									<div class="rereplybtn" style="cursor: pointer;">답글</div>
								</th:block>
							</div>
							<!-- 대댓글입력폼 -->
							<th:block th:if="${member != null}">
							
							<div class="reReplyformArea" style="display: none;">
								<img class="img" th:src="${member.profileSrc}"  alt="">
								<div class="reReplyform_form">
								<div th:text="${member.nickName}" class="nickName"></div>
							<form th:action="@{/reReplyPost/{postCode}(postCode=${post.postCode})}" 
									method="post" id="reReplyform" name="Reply">
										<div id="reReply" class="reReply"></div>
										<input th:value="${replylist.replyId}" name="postId" type="hidden">
									</form>
								</div>
							
							</div>
							</th:block>
							<!--  -->
						</div>
					</div>
					<hr>
					<th:block th:if="${reRep[replylist.replyId] != null}">
						<div th:each="reRep : ${reRep[replylist.replyId]}">
							<div th:each="item : ${reRep}" class="rereply">
								<div class="replyWrap">
								<img class="img" th:src="${item.userProfileSrc}"  alt="">
								<div class="rereplycont">							
									<div th:text="${item.nickName}"></div>
									<div th:text="${item.rereply}"></div>
									<div th:text="${item.rereplyCreateOn}"></div>
								</div>
							</div>
							</div>
							<hr>
						</div>
						
					</th:block>
					
					
					
					
				</tr>
			</th:block>
		
			<!-- 댓글 작성 -->
			<div class="replyWrite">
				<div>
					<!-- 로그인 안한 사람은 이거 못봤나...? 만약 못보는거면 th:block 여는태그 닫는태그 지워버리면 될듯 -->
					<th:block th:if="${member != null}">
						<form action="/replypost" method="post">
							<div class="replyformArea">
								<div class="replyer_profileimg">
									<img class="img" th:src="${member.profileSrc}"  alt="">
								</div>
								<div class="replyform_form">
									<div th:text="${member.nickName}" class="nickName"></div>
									<textarea th:field="*{reply.replyContent}"  type='text' placeholder='댓글을 작성하세요.'></textarea>
									<input th:field="*{reply.postId}" type="hidden" id="postCode">
									<div th:text="*{postCode}" id="postCodeDiv" style="display: none;"></div>
								</div>
								
							</div>
							<button id="submitBtn" class="submitBtn" type="submit">등록</button>
							
						</form>
					</th:block>

					<th:block th:if="${member == null}">
						<input th:field="*{reply.postId}" type="hidden" id="postCode">
						<div th:text="*{postCode}" id="postCodeDiv" style="display: none;"></div>
					 </th:block>
				</div>
				
			</div>
			
	</div>
<script th:inline="javascript">
    var member = /*[[${member}]]*/ [];
    var post = /*[[${post}]]*/ [];
</script>
	<script>


		
		function toggleEditDeleteButtons(icon) {
      // 클릭된 아이콘 바로 다음의 .edit-delete-buttons를 찾아서 토글
      const editDeleteButtons = icon.nextElementSibling;
      editDeleteButtons.style.display = (editDeleteButtons.style.display === 'none' || editDeleteButtons.style.display === '') ? 'block' : 'none';
    }
	

		function postLikes(){
			
			console.log("눌림");
			
			$.ajax({
	            type: 'POST',
	            url: '/insertLike',
	            data:{
				 "postCode" : postCode.value
					} ,
				dataType: 'html',
	            success: function (data) {
					if(data== "1"){
						$('#likesicon').removeClass('far fa-heart');
						$('#likesicon').addClass('fas fa-heart');
						
					}else if(data == "0"){
						$('#likesicon').removeClass('fas fa-heart');
						$('#likesicon').addClass('far fa-heart');
					}
					
            	}
			})
		}

		
   		if(member != null){
   		console.log(member.id);
			   
		   }
   		console.log(post);
		
   		let targetInformation = document.getElementById("targetInformation");

		let reportpostcnt =(member != null && member.id != post.memberId)?document.getElementById("reportedcheck"):"";
		console.log(reportpostcnt.value)
		let reportCheckModal = document.getElementById("reportCheckModal");
		let modalcontent = document.getElementById("modalcontent");
		
		let likes = document.getElementById("likes");
		let postCode = document.getElementById("postCode");
		let postCodeDiv = document.getElementById("postCodeDiv");
		
		let reReply = document.querySelectorAll(".reReply");
		let testReply = document.querySelectorAll(".testReply");
		
		let likescnt = (member != null)?document.getElementById("likescnt"):"";
		
		let likesicon = document.getElementById("likesicon");
		postCode.value = postCodeDiv.innerText;

		let cnt = likescnt.value;
		 let reportcnt = reportpostcnt.value;
		//let reportcnt = 1;

		let deleteBtn = (member != null && member.id == post.memberId)? document.getElementById("deleteBtn") : "";
		// let deleteBtn = document.getElementById("deleteBtn");
		if(deleteBtn != ""){
			deleteBtn.addEventListener("click",(e)=>{
				
				console.log("눌림");
					var previousPage = document.referrer;
					console.log(typeof(post.postCode));
					
					let deleteBtn = document.getElementById("deleteBtn");
					let deleteCancle = document.getElementById("deleteCancle");
					let deleteConfirm = document.getElementById("deleteConfirm");
				    
						jQuery(".deleteModal").fadeIn();
						jQuery(".modalBackground").fadeIn();
								jQuery(".edit-delete-buttons").fadeOut();
							deleteCancle.addEventListener("click", (e)=>{
							jQuery(".deleteModal").fadeOut();
							jQuery(".modalBackground").fadeOut();
					
							
					
						deleteCancle.addEventListener("click", (e)=>{
						jQuery(".deleteModal").fadeOut();
						jQuery(".modalBackground").fadeOut();
						});
						deleteConfirm.addEventListener("click", (e)=>{
							$.ajax({
							type: 'POST',
							url: '/postdelete',
							data:{
							"previousPage" : previousPage,
							"postCode" : post.postCode
								} ,
							// dataType: 'html',
							success: function (data) {
								alert('게시글이 삭제되었습니다.');
								if(data == "myPage"){
									window.location.href = "/myPage/"+ member.id;
								}else if(data == "book"){
									
									window.location.href = "/menu/book";
								}

								else if(data == "movie"){

									window.location.href = "/menu/movie";
								}else{

									window.location.href = "/menu/concert";
								}
								
							}
						})
							
						})
						
					});
					
					
					
					
				})	
		}
		if(cnt==0){
			$('#likesicon').removeClass('fas fa-heart');
			$('#likesicon').addClass('far fa-heart');
		} else{
			$('#likesicon').removeClass('far fa-heart');
			$('#likesicon').addClass('fas fa-heart');
		};
		
		
		if(reportcnt==1){
			modalcontent.innerText = "이미 신고한 글입니다.";
			reportCancle.innerText = "확인";
			reportConfirm.style.display = "none";
		}
		
		
		let reReplyformArea = document.querySelectorAll(".reReplyformArea")
		let rereplybtn = document.querySelectorAll(".rereplybtn");
		var addedDiv = document.createElement("div");
			
			

			for(let i=0; i<reReply.length; i++){
				
				rereplybtn[i].addEventListener("click", (e)=>{
					e.preventDefault();

					 if(document.getElementById(i+'Div')){
						 document.getElementById(i+'Div').remove();
						 reReplyformArea[i].style.display = 'none';
					 } else {
						reReplyformArea[i].style.display = 'flex';
					addedDiv.id = i +'Div';
					reReply[i].after(addedDiv);
					addedDiv.innerHTML = "<div id='" + i +"' class='replyformdiv'>\
							<textarea type='text' name='replyContent' placeholder='댓글을 작성하세요.'></textarea>\
							<button type='submit'>등록</button>\
						 </div>";
					 }
					
					});
			
					
		}
	 
			
			if(member.id != post.memberId){
				let reportbtn = document.getElementById("reportbtn");
				let reportCancle = document.getElementById("reportCancle");
				let reportConfirm = document.getElementById("reportConfirm");
			    reportbtn.addEventListener("click", (e)=>{
					jQuery(".reportCheckModal").fadeIn();
					jQuery(".modalBackground").fadeIn();
				
					reportCancle.addEventListener("click", (e)=>{
						jQuery(".reportCheckModal").fadeOut();
						jQuery(".modalBackground").fadeOut();
					});
					
					reportCancle.addEventListener("click", (e)=>{
						jQuery(".reportCheckModal").fadeOut();
						jQuery(".modalBackground").fadeOut();
					});
					reportConfirm.addEventListener("click", (e)=>{
						$.ajax({
					            type: 'POST',
					            url: '/insertReportPost',
				            data:{
							 "postCode" : postCode.value
							} ,
							dataType: 'html',
	            
			            success: function (data) {
							if(data == "1"){
								modalcontent.innerText = "신고되었습니다.";
								reportCancle.innerText = "확인";
								reportConfirm.style.display = "none";
							}
						
		            },
		        })
					
				});
			
			});
			}
		
		
		
	</script>
	<script th:src="@{/js/nav.js}"></script>    
</body>
</html>
