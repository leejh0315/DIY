<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
	<script src='https://kit.fontawesome.com/c8fabc7e12.js' crossorigin='anonymous'></script>
	<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/postdetail.css}">

</head>
<body>
	<th:block th:if="${member == null}">
		<div th:replace="main/header :: headFrag(${none})"></div>
	</th:block>
	<th:block th:if="${member != null}">
		<div th:replace="main/header :: headFrag(${member.activeUUID})"></div>
	</th:block>
	
	<!-- posts -->
	<div class="posts_wrap">
	<div class="posttitle" th:text="${post.title}"></div>
	
		<th:block th:if="${postWriteMember.profileSrc == null}"> <!-- 프로필 이미지 없을때-->
			<div class="writerinfo">
				<div class="writer_profileimg">
					<img th:src="@{/img/defalut_profileimg.jpg}" alt="">
				</div>
					<p th:text="${postWriteMember.nickName}" class="nickName"></p>    
					<p th:text="${post.createOn}" class="createOn"></p>
					<i class="fas fa-ellipsis-h fa-sm"></i>
				</div>
		</th:block>
				
		<th:block th:if="${postWriteMember.profileSrc != null}"> <!-- 프로필 이미지 있을때-->
			<div class="userinfo">
				<div class="profileimg">
				<img th:src="@{postWriteMember.profileSrc}">
				</div>
					<p th:text="${postWriteMember.nickName}" class="nickName"></p>
					<p th:text="${post.createOn}" class="createOn"></p>
					<i class="fas fa-ellipsis-h fa-sm"></i>   
			</div>
		</th:block>

		

		<div></div>
		
		<hr>

		
			<div class="infotitle">작품정보</div>
			<div id="targetInformation" class="targetInformation">
				<input type="hidden" id="targetThumb" class="targetThumb" th:value = "${post.targetThumbnail}"
					style="width: 100px;">
				<div class="infodetail">
					<div th:text="${post.targetName}"></div>
					<div th:text="${post.targetSubName}"></div>
					<div th:text="${post.targetAuthor}"></div>
				</div>
				<div class="ratebox" >
					★<p th:text="${post.starCount}" style="padding-left: 5px;"></p>
				</div>
			</div>
		
			<hr>
		
		<div class="postcontent" th:utext="${post.content}"></div>
		<div class="likes" id="likes"><i class="far fa-heart" style="color: #9A9E7B;"></i><p>좋아요</p></div>

		<div class="replycnt">댓글<div>2</div></div>
		<hr>
			<!-- 댓글리스트 -->
			<tr th:each="replylist :${replylist}">
				<img  th:src="@{replylist.userProfileSrc}" alt=""></img>
				<div><td th:text ="${replylist.nickName}"></td></div>
				<div><td th:text="${replylist.replyContent}"></td></div>
				<div><td th:text="${replylist.replyCreateDate}"></td></div>
				
				<div id="reReply", class="reReply" style="cursor: pointer;">답글</div>
			</tr>
		<hr>
			<!-- 댓글 작성 -->
			<div class="replyWrite">
				<div class="replyer_profileimg">
					<img th:src="@{member.profileSrc}">
				</div>
				<div>
					<!-- 로그인 안한 사람은 이거 못봤나...? 만약 못보는거면 th:block 여는태그 닫는태그 지워버리면 될듯 -->
					<th:block th:if="${member != null}">
						<form action="/replypost" method="post">
							<p th:text="${member.nickName}" class="nickName"></p>
							<input  th:field="*{reply.replyContent}" type="text" class="" placeholder="댓글을 입력하세요">
							<input th:field="*{reply.postId}" type="hidden" id="postCode">
							<div th:text="*{postCode}" id="postCodeDiv" style="display: none;"></div>
							<button id="submitBtn" class="submitBtn" type="submit">등록</button>
						</form>
					</th:block>

					<th:block th:if="${member == null}">
						<input th:field="*{reply.postId}" type="hidden" id="postCode">
						<div th:text="*{postCode}" id="postCodeDiv" style="display: none;"></div>
					 </th:block>
				</div>
				
			</div>
			
	</div>
	<script>
		
		$( document ).ready(function() {
   			
   		let targetInformation = document.getElementById("targetInformation");

		let thumb = document.getElementById("targetThumb");
		let likes = document.getElementById("likes");
		let postCode = document.getElementById("postCode");
		let postCodeDiv = document.getElementById("postCodeDiv");
		let reReply = document.querySelectorAll(".reReply");
		console.log(reReply);
		console.log(reReply.length);
		
		postCode.value = postCodeDiv.innerText;

		
		console.log(thumb.value);
		if(thumb.value == null || thumb.value == ""){
			
		}else{
			targetInformation.innerHTML+="<img class='targetThumb' src='"+thumb.value+"'>"		
		}
		
   		
		var addedDiv = document.createElement("div");
			
			for(let i=0; i<reReply.length; i++){
				
					reReply[i].addEventListener("click", (e)=>{
						e.preventDefault();
						
						
	 					
	 					if(document.getElementById(i+'Div')){
							 document.getElementById(i+'Div').remove();
						 } else {
						addedDiv.id = i +'Div';
						reReply[i].after(addedDiv);
						addedDiv.innerHTML = "<div id='" + i +"'>\
						<form action='/reReplypost' method='post' id='reReplyform'>\
								<input type='text'>\
								<button type='submit'>작성</button>\
							 </form></div>";
						 }
						
						});
				
						
			}
			
			
			
			
			
			
		});
		
		
		
		
	</script>
    
</body>
</html>
