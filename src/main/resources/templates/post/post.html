<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">

<link href="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>


<link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote.min.js"></script>


	<style>
		.result{
			text-align: center;
			display: inline-block;
			height: 160px;
			width: 100px;
		}
		.title{
			width: 100px;
		}
		img{
			height: 100px;
			width: 60px;
		}
		.modal{
			position: absolute;
			z-index: 1;
			top:20%;
			left:20%;
			width: 50%;
			height: 50%;
			background-color: rgba(0,0,0,0.4);
		}
		#modalOffButton{
			position: absolute;
			right: 10px;
		}
		.selectedWork{
			border: solid 1px black;
			width: 200px;
			height: 140px;
		}
		.rating {
		position: relative;
		width: 180px;
		background: transparent;
		display: flex;
		justify-content: center;
		align-items: center;
		gap: .3em;
		padding: 5px;
		overflow: hidden;
		border-radius: 20px;
		box-shadow: 0 0 2px #b3acac;
		}

		.rating__result {
		position: absolute;
		top: 0;
		left: 0;
		transform: translateY(-10px) translateX(-5px);
		z-index: -9;
		font: 3em Arial, Helvetica, sans-serif;
		color: #ebebeb8e;
		pointer-events: none;
		}

		.rating__star {
		font-size: 1.3em;
		cursor: pointer;
		color: #dabd18b2;
		transition: filter linear .3s;
		}

		.rating__star:hover {
		filter: drop-shadow(1px 1px 4px gold);
		}
	</style>


</head>
<body>
	<h1>Post</h1>
	<div class="modal" id="modal">
		<div>
			<div>작품 검색</div>
			<div id="modalOffButton">X</div>
			
			<label>카테고리
				<select id="categorySelect">
					<option value="none" selected>선택</option>
					<option value="book">도서</option>
					<option value="concert">공연</option>
					<option value="movie">영화</option>
				</select>
			</label>
			작품명<input id="keyword1">
			<button id="searchButton">검색</button><br>
			
			<div id="searchResult"></div>
			
		</div>
	</div>

				
	<p>어떤 작품에 대하여 쓰나요?</p>
	<p>감상문을 작성할 작품을 검색해서 등록해보세요.</p>
	<button id="modalOnButton">작품 검색</button><br><br>

	<p>선택한 작품</p>
	<div class="selectedWork" id="selectedWork"></div>	

	<p>나의 별점</p>
	<div class="rating">
		<span class="rating__result"></span> 
		<i class="rating__star far fa-star"></i>
		<i class="rating__star far fa-star"></i>
		<i class="rating__star far fa-star"></i>
		<i class="rating__star far fa-star"></i>
		<i class="rating__star far fa-star"></i>
	</div>
				
	<br><br>
		<!--<form action="/post" method="post" name="post" th:object="${post}" enctype="multipart/form-data"> 
			제목<input th:field="*{title}"><br>-->
		<form method="post">
			내용<textarea id="summernote" name="editordata"></textarea>
		</form>
		<button id="submitBtn">입력</button>
			
	<script>
		$("#modal").css("display", "none");
			
		$('#summernote').summernote({
           height: 300,                 // 에디터 높이
           minHeight: null,             // 최소 높이
           maxHeight: null,             // 최대 높이
           focus: true,                  // 에디터 로딩후 포커스를 맞출지 여부
           lang: "ko-KR",               // 한글 설정
           placeholder: '내용을 입력하세요'   ,//placeholder 설정
           toolbar: [
                   // [groupName, [list of button]]
                   ['fontname', ['fontname']],
                   ['fontsize', ['fontsize']],
                   ['color', ['color']],
                   ['style', ['bold', 'italic', 'underline','strikethrough', 'clear']],
                   ['para', ['ul', 'ol', 'paragraph']],
                   ['height', ['height']],
                        ['insert', ['link', 'picture']],
                   ],
               fontNames: ['Arial', 'Arial Black', 'Comic Sans MS', 'Courier New','맑은 고딕','궁서','굴림체','굴림','돋움체','바탕체'],
               fontSizes: ['8','9','10','11','12','14','16','18','20','22','24','28','30','36','50','72']
                
      });

		let categorySelect = document.getElementById("categorySelect");
		let modal = document.getElementById("modal");
		let submitBtn = document.getElementById("submitBtn");
		let modalOnButton = document.getElementById("modalOnButton");
		let modalOffButton = document.getElementById("modalOffButton");
		let form = document.post;

		let selectedWork = document.getElementById("selectedWork");
		let selectedWorkImage = document.getElementById("selectedWorkImage");
		let selectedWorkTitle= document.getElementById("selectedWorkTitle");
		let selectedWorkAuthor= document.getElementById("selectedWorkAuthor");

		let searchResult = document.getElementById("searchResult");

		let searchBookList;
		let searchMovieList;
		let serachMovieListLength;
		let searchMovieResult = document.getElementById("searchMovieResult");
		let searchConcertResult = document.getElementById("searchConcertResult");
		let resultC = [];
		let resultC_name= [];
		let resultC_type = [];
		let resultC_thumb = [];
		let modalTogle = true;
		let tempBool =false;
		modalOnButton.addEventListener("click", (e)=>{
		if(modalTogle){
			modal.style.display="flex";
			$("section1").css("background-color", "ligthgray");
			modalTogle = false;
		}else{
			$("#modal").css("display", "none");
			$("section1").css("background-color", "white");
			modalTogle = true;
		}
		});

		modalOffButton.addEventListener("click", (e)=>{
		$("#modal").css("display", "none");
		$("section1").css("background-color", "white")	
		})

		submitBtn.addEventListener('click',(e)=>{
			form.submit();
		});	

		let keyword1 = document.getElementById("keyword1");
		let searchButton = document.getElementById("searchButton");

		searchButton.addEventListener("click", (e)=>{
			e.preventDefault();
			
			searchResult.innerHTML = "";
			resultC_name = [];
			resultC_type = [];
			resultC_thumb = [];
			let keyword = keyword1.value.toString();
			
			if(categorySelect.value == "none"){
				alert("검색어를 입력해주세요.");	
			}else if(categorySelect.value == "book"){
				$.ajax({
					type: "GET",
					url: "/kakaoBookSearch/"+keyword,
					dataType: "json",
					contentType:"application/json",
				}).done(function(res) {
					searchBookList = res.documents;
					for(let i = 0 ; i < res.documents.length; i++){
						if(res.documents[i].authors == "" || res.documents[i].authors == null){
							res.documents[i].authors = "작가 없음";
							searchResult.innerHTML += 
							"<div class='result' onclick='selectedBook(this)' id='" + i +"'> <img src='"+res.documents[i].thumbnail +"'><p class='title'>"+res.documents[i].title+"</p><p>"+res.documents[i].authors+"</p></div>";
						}else{
							searchResult.innerHTML += 
							"<div class='result' onclick='selectedBook(this)' id='" + i +"'> <img src='"+res.documents[i].thumbnail +"'><p class='title'>"+res.documents[i].title+"</p><p>"+res.documents[i].authors+"</p></div>";
						}
					};
				}).fail(function (error) {
					alert("api호출에 실패하였습니다.");
				});
								
			}else if(categorySelect.value == "concert"){
				$.ajax({
					type: "GET",
					url: "concert/"+keyword,
					dataType: "xml",
					//contentType:"application/json",
				}).done(function(res) {	
					let resTextToString = $(res).text().toString();	
					resultC = resTextToString.split('        ');
					for(let i = 2 ; i< resultC.length; i++){
						if(i%9 == 2){
							resultC_name.push(resultC[i]);
						}
						if(i%9 == 7){
							resultC_type.push(resultC[i]);
						}
						if(i%9 == 6){
							resultC_thumb.push(resultC[i]);
						}
					}
					
					for(let i = 0 ; i < resultC_name.length; i++){
						searchResult.innerHTML += 
						"<div class='result' onclick='selected(this)' id='"+ i + "'> <img src='"+resultC_thumb[i] +
						"'><p class='title'>"+
						resultC_name[i]+
						"</p><p>"+
						resultC_type[i]+"</p></div>";
					}
					}).fail(function (error) {
						alert("api호출에 실패하였습니다.");
					});
					
				}else if(categorySelect.value == "movie"){
					$.ajax({
						type: "GET",
						url: "movie/"+keyword,
						dataType: "json",
						//contentType:"application/json",
						}).done(function(res) {	
						
						searchMovieList = res.Data[0].Result;
						serachMovieListLength = res.Data[0].Result.length;
						
					for(let i = 0 ; i < serachMovieListLength; i++){
						let tempImageUrl = searchMovieList[i].posters;
						let a = tempImageUrl.indexOf('|');

						let tempTitle = searchMovieList[i].title.replace(/!HE/g, '');
						tempTitle = tempTitle.replace(/!HS/g, '');
						searchMovieList[i].directors = searchMovieList[i].directors.director[0].directorNm 
						searchMovieList[i].title = tempTitle;
						if(a != -1){
							tempImageUrl = tempImageUrl.substr(0, a);
							searchMovieList[i].posters = tempImageUrl;

							searchResult.innerHTML += 
							"<div class='result' onclick='selectMovie(this)' id='"+ i + "'> <img src='"+tempImageUrl +
							"'><p class='title'>"+
							tempTitle+
							"</p><p>"+
							searchMovieList[i].directors+"</p></div>";
						}else{
							searchResult.innerHTML += 
							"<div class='result' onclick='selectMovie(this)' id='"+ i + "'> <img src='"+searchMovieList[i].posters +
							"'><p class='title'>"+
							tempTitle+
							"</p><p>"+
							searchMovieList[i].directors + "</p></div>";
						}
					}
						}).fail(function (error) {
							alert("api호출에 실패하였습니다.");
						});
				}	
		});

function selected(e){
	selectedWork.innerHTML = "";
	let tempNumber = parseInt($(e).attr('id'));
	selectedWork.innerHTML += 
	"<img src='" + resultC_thumb[tempNumber] + "'>\
	<div>"+resultC_name[tempNumber]+"</div>\
	<div>"+resultC_type[tempNumber]+"</div>"
	$(".modal").css("display","none");
	modalTogle = true;
}

function selectedBook(e){
	selectedWork.innerHTML = "";
	let tempNumber = parseInt($(e).attr('id'));
	selectedWork.innerHTML += 
	"<img src='" + searchBookList[tempNumber].thumbnail + "'>\
	<div>"+searchBookList[tempNumber].title+"</div>\
	<div>"+searchBookList[tempNumber].authors+"</div>"
	$(".modal").css("display","none");
	modalTogle = true;
}

function selectMovie(e){
	selectedWork.innerHTML = "";
	let tempNumber = parseInt($(e).attr('id'));
	selectedWork.innerHTML += 
	"<img src='" + searchMovieList[tempNumber].posters + "'>\
	<div>"+searchMovieList[tempNumber].title+"</div>\
	<div>"+searchMovieList[tempNumber].directors +"</div>"
	$(".modal").css("display","none");
	modalTogle = true;
}
//searchMovieList[i].posters
const ratingStars = [...document.getElementsByClassName("rating__star")];
let starCount = document.querySelectorAll("rating__star far fa-star");
let starCountNumber = document.getElementById("starCountNumber");



const ratingResult = document.querySelector(".rating__result");

printRatingResult(ratingResult);

function executeRating(stars, result) {
const starClassActive = "rating__star fas fa-star";
const starClassUnactive = "rating__star far fa-star";
const starsLength = stars.length;
let i;
stars.map((star) => {
star.onclick = () => {
	i = stars.indexOf(star);

	if (star.className.indexOf(starClassUnactive) !== -1) {
		printRatingResult(result, i + 1);
		for (i; i >= 0; --i) stars[i].className = starClassActive;
	} else {
		printRatingResult(result, i);
		for (i; i < starsLength; ++i) stars[i].className = starClassUnactive;
	}
};
});
}

function printRatingResult(result, num = 0) {
result.textContent = `${num}/5`;
}

executeRating(ratingStars, ratingResult);
</script>
</body>
</html>
