	<style>
		.result{
			text-align: center;
			display: inline-block;
			height: 160px;
			width: 100px;
		}
		.title{
			width: 100px;
		}
		img{
			height: 100px;
			width: 60px;
		}
		.searchModal{
			z-index: 1;
			position: absolute;
			top:20%;
			left:20%;
			width: 50%;
			height: 50%;
			background-color: rgba(0,0,0,0.4);
		}
		#searchModalOffButton{
			position: absolute;
			right: 10px;
		}
		.selectedWork{
			border: solid 1px black;
			width: 200px;
			height: 140px;
		}
		.rating {
		position: relative;
		width: 180px;
		background: transparent;
		display: flex;
		justify-content: center;
		align-items: center;
		gap: .3em;
		padding: 5px;
		overflow: hidden;
		border-radius: 20px;
		box-shadow: 0 0 2px #b3acac;
		}

		.rating__result {
		position: absolute;
		top: 0;
		left: 0;
		transform: translateY(-10px) translateX(-5px);
		z-index: -9;
		font: 3em Arial, Helvetica, sans-serif;
		color: #ebebeb8e;
		pointer-events: none;
		}

		.rating__star {
		font-size: 1.3em;
		cursor: pointer;
		color: #dabd18b2;
		transition: filter linear .3s;
		}

		.rating__star:hover {
		filter: drop-shadow(1px 1px 4px gold);
		}
	</style>


</head>
<body>
	<h1>Post</h1>
	<form action="/writePost" method="post" name="writePost" th:object="${writePost}" enctype="multipart/form-data">

	<div class="searchModal" id="searchModal">
		<div>
			<div>작품 검색</div>
			<div id="searchModalOffButton">X</div>
			
			<label>카테고리
				<select id="categorySelect" th:field='${writePost.postCtCode}'>
					<option value="none" selected th:value="none">선택</option>
					<option value="book"  th:value="book">도서</option>
					<option value="concert"  th:value="concert">공연</option>

		</div>
	</div>
	 
	
				
		<p>어떤 작품에 대하여 쓰나요?</p>
		<p>감상문을 작성할 작품을 검색해서 등록해보세요.</p>
		<button id="searchModalOnButton" type="button">작품 검색</button><br><br>
	
		<p>선택한 작품</p>
		<div class="selectedWork" id="selectedWork"></div>	
			<input type="hidden" id="targetName" th:field="*{targetName}">
			<input type="hidden" id="targetSubName" th:field="*{targetSubName}">
			<input type="hidden" id="targetAuthor" th:field="*{targetAuthor}">
			<input type="hidden" id="targetThumbnail" th:field="*{targetThumbnail}">
	
		<p>나의 별점</p>
		<div class="rating">
			<span class="rating__result" id="starCnt"></span> 
			<i class="rating__star far fa-star"></i>
			<i class="rating__star far fa-star"></i>
			<i class="rating__star far fa-star"></i>
			<i class="rating__star far fa-star"></i>
			<i class="rating__star far fa-star"></i>
		</div>
			<input type="hidden" id="stars" th:field="*{starCount}" value="">
				
	
		 
		<label>제목<input th:field="*{title}"></label>
			
		
		<textarea id="summernote" name="editordata" th:field="*{content}"></textarea>
		
		<button id="submitBtn" type="submit">입력</button>
	</form>
			
	<script>
		$("#searchModal").css("display", "none");
		
		
		$('#summernote').summernote({
            // 썸머노트 옵션 설정
            codeviewFilter: false,
            codeviewIframeFilter: false,
            disableXSSProtection: true,
            height: 500,
            minHeight: null,
            maxHeight: null,
            focus: true,
            lang: 'ko-KR',
            toolbar: [
                // 스타일 관련 기능
                ['style', ['style']],
                // 글자 크기 설정
                ['fontsize', ['fontsize']],
                // 글꼴 스타일
                ['font', ['bold', 'underline', 'clear']],
                // 글자 색상
                ['color', ['color']],
                // 테이블 삽입
                ['table', ['table']],
                // 문단 스타일
                ['para', ['paragraph']],
                // 에디터 높이 설정
                ['height', ['height']],
                // 이미지, 링크, 동영상 삽입
                ['insert', ['picture', 'link', 'video']],
                // 코드 보기, 전체화면, 도움말
                ['view', ['codeview', 'fullscreen', 'help']],
            ],
            fontSizes: [
                // 글자 크기 선택 옵션
                '8', '9', '10', '11', '12', '14', '16', '18', '20', '22', '24', '28', '30', '36', '50', '72'
            ],
            styleTags: [
                // 스타일 태그 옵션
                'p',
                { title: 'Blockquote', tag: 'blockquote', className: 'blockquote', value: 'blockquote' },
                'pre',
                { title: 'code_light', tag: 'pre', className: 'code_light', value: 'pre' },
                { title: 'code_dark', tag: 'pre', className: 'code_dark', value: 'pre' },
                'h1', 'h2', 'h3', 'h4', 'h5', 'h6'
            ],

            callbacks: {
                onImageUpload: function (files, editor, welEditable) {
                    // 파일 업로드
                    for (var i = files.length - 1; i >= 0; i--) {
                        var fileName = files[i].name
                        var caption = prompt('이미지 설명:', fileName)
                        if (caption == '') {
                            caption = '이미지'
                        }
                        uploadSummernoteImageFile(files[i], this, caption)
                    }
                },
                onMediaDelete: function ($target, editor, $editable) {
                    // 삭제된 이미지의 파일 이름을 알아내기 위해 split 활용
                    if (confirm('이미지를 삭제하시겠습니까?')) {
                        var deletedImageUrl = $target.attr('src').split('/').pop()

                        // ajax 함수 호출
                        deleteSummernoteImageFile(deletedImageUrl)
                    }
                },
            },
        })
    

    // 이미지 업로드 ajax
    function uploadSummernoteImageFile(file, el, caption) {
        data = new FormData()
        data.append('file', file)
        $.ajax({
            data: data,
            type: 'POST',
            url: 'uploadSummernoteImageFile',
            contentType: false,
            enctype: 'multipart/form-data',
            processData: false,
            success: function (data) {
                $(el).summernote('editor.insertImage', data.url, function ($image) {
                    $image.attr('alt', caption) // 캡션 정보를 이미지의 alt 속성에 설정
                })
            },
        })
    }

    // 이미지 삭제 ajax
    function deleteSummernoteImageFile(imageName) {
        data = new FormData()
        data.append('file', imageName)
        $.ajax({
            data: data,
            type: 'POST',
            url: 'deleteSummernoteImageFile',
            contentType: false,
            enctype: 'multipart/form-data',
            processData: false,
        })
    }

		let starCnt = document.getElementById("starCnt");
		let stars = document.getElementById("stars");
		
		let categorySelect = document.getElementById("categorySelect");
		let searchModal = document.getElementById("searchModal");
		let submitBtn = document.getElementById("submitBtn");
		let searchModalOnButton = document.getElementById("searchModalOnButton");
		let searchModalOffButton = document.getElementById("searchModalOffButton");
		//let form = document.post;

		let selectedWork = document.getElementById("selectedWork");
		let selectedWorkImage = document.getElementById("selectedWorkImage");
		let selectedWorkTitle= document.getElementById("selectedWorkTitle");
		let selectedWorkAuthor= document.getElementById("selectedWorkAuthor");

		let searchResult = document.getElementById("searchResult");

		let searchBookList;
		let searchMovieList;
		let serachMovieListLength;
		let searchMovieResult = document.getElementById("searchMovieResult");
		let searchConcertResult = document.getElementById("searchConcertResult");
		let resultC = [];
		let resultC_name= [];
		let resultC_type = [];
		let resultC_thumb = [];
		let searchModalTogle = true;
		let tempBool =false;
		
		let targetName = document.getElementById("targetName");
		let targetSubName = document.getElementById("targetSubName");
		let targetAuthor = document.getElementById("targetAuthor");
		let targetThumbnail = document.getElementById("targetThumbnail");
		
		
		searchModalOnButton.addEventListener("click", (e)=>{
		if(searchModalTogle){
			//searchModal.style.display="flex";

		})

//		submitBtn.addEventListener('click',(e)=>{
//			form.submit();
//		});	

		let keyword1 = document.getElementById("keyword1");
		let searchButton = document.getElementById("searchButton");

		searchButton.addEventListener("click", (e)=>{
			e.preventDefault();
			console.log("검색시작")
			searchResult.innerHTML = "";
			resultC_name = [];
			resultC_type = [];
			resultC_thumb = [];
			let keyword = keyword1.value.toString();
			
			if(categorySelect.value == "none"){
				alert("검색어를 입력해주세요.");	
			}else if(categorySelect.value == "book"){
				$.ajax({
					type: "GET",
					url: "/kakaoBookSearch/"+keyword,
					dataType: "json",
					contentType:"application/json",
				}).done(function(res) {
					console.log("책 api 호출 시작")
					searchBookList = res.documents;
					for(let i = 0 ; i < res.documents.length; i++){
						if(res.documents[i].authors == "" || res.documents[i].authors == null){
							res.documents[i].authors = "작가 없음";
							searchResult.innerHTML += 
							"<div class='result' onclick='selectedBook(this)' id='" + i +"'>\
								 <img src='"+res.documents[i].thumbnail +"'> \
								 <p class='title'>"+res.documents[i].title+"</p>\
								 <p>"+res.documents[i].authors+"</p>\
								 </div>";
						}else{
							searchResult.innerHTML += 
							"<div class='result' onclick='selectedBook(this)' id='" + i +"'>\
								 <img src='"+res.documents[i].thumbnail +"'>\
								 <p class='title' >"+res.documents[i].title+"</p>\
								 <p>"+res.documents[i].authors+"</p>\
								 </div>";
						}
					};
					console.log("책 api 호출 완료")
				}).fail(function (error) {
					alert("api호출에 실패하였습니다.");
				});
								
			}else if(categorySelect.value == "concert"){
				$.ajax({
					type: "GET",
					url: "concert/"+keyword,
					dataType: "xml",
					//contentType:"application/json",
				}).done(function(res) {	
					let resTextToString = $(res).text().toString();	
					resultC = resTextToString.split('        ');
					for(let i = 2 ; i< resultC.length; i++){
						if(i%9 == 2){
							resultC_name.push(resultC[i]);
						}
						if(i%9 == 7){
							resultC_type.push(resultC[i]);
						}
						if(i%9 == 6){
							resultC_thumb.push(resultC[i]);
						}
					}
					
					for(let i = 0 ; i < resultC_name.length; i++){
						searchResult.innerHTML += 
						"<div class='result' onclick='selected(this)' id='"+ i + "'> <img src='"+resultC_thumb[i] +
						"'><p class='title'>"+
						resultC_name[i]+
						"</p><p>"+
						resultC_type[i]+"</p></div>";
					}
					}).fail(function (error) {
						alert("api호출에 실패하였습니다.");
					});
					
				}else if(categorySelect.value == "movie"){
					$.ajax({
						type: "GET",
						url: "movie/"+keyword,
						dataType: "json",
						//contentType:"application/json",
						}).done(function(res) {	
						console.log(res);
						searchMovieList = res.Data[0].Result;
						if(res.TotalCount == 0){
							alert("검색된 영화가 없습니다. 제목을 확인해주세요.");
							return false;							
						}else{
							serachMovieListLength = res.Data[0].Result.length;
						}
							
						
					for(let i = 0 ; i < serachMovieListLength; i++){
						let tempImageUrl = searchMovieList[i].posters;
						let a = tempImageUrl.indexOf('|');

						let tempTitle = searchMovieList[i].title.replace(/!HE/g, '');
						tempTitle = tempTitle.replace(/!HS/g, '');
						searchMovieList[i].directors = searchMovieList[i].directors.director[0].directorNm 
						searchMovieList[i].title = tempTitle;
						if(a != -1){
							tempImageUrl = tempImageUrl.substr(0, a);
							searchMovieList[i].posters = tempImageUrl;

							searchResult.innerHTML += 
							"<div class='result' onclick='selectMovie(this)' id='"+ i + "'> <img src='"+tempImageUrl +
							"'><p class='title'>"+
							tempTitle+
							"</p><p>"+
							searchMovieList[i].directors+"</p></div>";
						}else{
							searchResult.innerHTML += 
							"<div class='result' onclick='selectMovie(this)' id='"+ i + "'> <img src='"+searchMovieList[i].posters +
							"'><p class='title'>"+
							tempTitle+
							"</p><p>"+
							searchMovieList[i].directors + "</p></div>";
						}
					}
						}).fail(function (error) {
							alert("api호출에 실패하였습니다.");
						});
				}	
		});


function selected(e){
	selectedWork.innerHTML = "";
	let tempNumber = parseInt($(e).attr('id'));
	
	targetName.value = resultC_name[tempNumber];
	targetAuthor.value = resultC_type[tempNumber];
	targetThumbnail.value = resultC_thumb[tempNumber];
	
	selectedWork.innerHTML += 
	"<img src='" + resultC_thumb[tempNumber] + "'>\
	<div>"+resultC_name[tempNumber]+"</div>\
	<div>"+resultC_type[tempNumber]+"</div>"
	$(".searchModal").css("display","none");
	searchModalTogle = true;
}

function selectedBook(e){
	selectedWork.innerHTML = "";
	let tempNumber = parseInt($(e).attr('id'));
	
	targetName.value = searchBookList[tempNumber].title;
	targetAuthor.value = searchBookList[tempNumber].authors;
	targetThumbnail.value = searchBookList[tempNumber].thumbnail;
	
	selectedWork.innerHTML += 
		"<img src='" + searchBookList[tempNumber].thumbnail + "'>\
		<div>"+searchBookList[tempNumber].title+"</div>\
		<div>"+searchBookList[tempNumber].authors+"</div>";
	$(".searchModal").css("display","none");
	searchModalTogle = true;
}

function selectMovie(e){
	selectedWork.innerHTML = "";
	let tempNumber = parseInt($(e).attr('id'));
	
	targetName.value = searchMovieList[tempNumber].title;
	targetAuthor.value = searchMovieList[tempNumber].directors;
	targetThumbnail.value = searchMovieList[tempNumber].posters;
	
	selectedWork.innerHTML += 
	"<img src='" + searchMovieList[tempNumber].posters + "'>\
	<div>"+searchMovieList[tempNumber].title+"</div>\
	<div>"+searchMovieList[tempNumber].directors +"</div>"
	$(".searchModal").css("display","none");
	searchModalTogle = true;
}
//searchMovieList[i].posters
const ratingStars = [...document.getElementsByClassName("rating__star")];
let starCount = document.querySelectorAll("rating__star far fa-star");
let starCountNumber = document.getElementById("starCountNumber");



const ratingResult = document.querySelector(".rating__result");

printRatingResult(ratingResult);

function executeRating(stars, result) {
const starClassActive = "rating__star fas fa-star";
const starClassUnactive = "rating__star far fa-star";
const starsLength = stars.length;
let i;
stars.map((star) => {
star.onclick = () => {
	i = stars.indexOf(star);

	if (star.className.indexOf(starClassUnactive) !== -1) {
		printRatingResult(result, i + 1);
		for (i; i >= 0; --i) stars[i].className = starClassActive;
		
		let tempStarCnt = starCnt.innerText;
		tempStarCnt = tempStarCnt.substring(0,1);
		let tempIntStarCnt = parseInt(tempStarCnt);
		$('#stars').val(tempIntStarCnt);
	
	} else {
		printRatingResult(result, i);
		for (i; i < starsLength; ++i) stars[i].className = starClassUnactive;
		
		let tempStarCnt = starCnt.innerText;
		tempStarCnt = tempStarCnt.substring(0,1);
		let tempIntStarCnt = parseInt(tempStarCnt);
		$('#stars').val(tempIntStarCnt);
		
		
		
		
		
	}
};
});
}


function printRatingResult(result, num = 0) {
result.textContent = `${num}/5`;
}

executeRating(ratingStars, ratingResult);
</script>
