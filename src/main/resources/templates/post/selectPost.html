<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
	<h1>selectPost</h1>
	
	<table>
		<thead>
			<tr>
				<th>제목</th>
				<th>내용</th>
			</tr>
		</thead>
		
		<tbody th:each="post:${post}">
			<tr>
				<td class="tr" th:text="${post.name}"></td>
				<td class="tr" th:text="${post.content}"></td>
				
			</tr>
		</tbody>
		
	</table>
    
</body>
</html>
